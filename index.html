<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Hoops 1v1</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0b0d1a}
.tb{position:fixed;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:14px;display:none;align-items:center;justify-content:center;touch-action:none;z-index:5}
.tb:active,.tb.on{background:rgba(255,210,63,.35)}
body.touch.playing .tb{display:flex}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div class="tb" id="tL" style="left:14px;bottom:96px">◀</div>
<div class="tb" id="tR" style="left:102px;bottom:96px">▶</div>
<div class="tb" id="tJ" style="right:14px;bottom:176px">JUMP</div>
<div class="tb" id="tS" style="right:102px;bottom:100px">SKILL</div>
<div class="tb" id="tF" style="right:14px;bottom:76px;width:84px;height:84px;background:rgba(55,224,106,.25)">SHOOT</div>
<script>
(()=>{
'use strict';
// ====================== CONSTANTS ======================
const W=1280,H=720,FLOOR=640,BAND_TOP=600;
const RIM_Y=400,RIM_HALF=32,ARC_D=330,FT_D=225,HX=[1150,130];
const BALL_R=12,BALL_G=1400,PG=2400,JV=700,SPD=320,FILL=1.05,TARGET=0.80,STEP=1/120;
const L_LEG=36,L_ARM=29,TORSO=46;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), sgn=v=>v<0?-1:v>0?1:0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let RES=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';RES=clamp(s*(window.devicePixelRatio||1),0.6,2);cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);}
addEventListener('resize',resize);resize();

// ====================== DATA ======================
const CHARS=[
 {name:'BLAZE',skin:'#f0b48a',jersey:'#e5392a',trim:'#ffd23f',shoes:'#ffffff',hair:'#2a160d',fx:'fire',cel:'flex',col:'#ff6a2b',tag:'Flame trails • Fire-burst dunks'},
 {name:'FROST',skin:'#8d5b3e',jersey:'#2b8cf0',trim:'#d9f8ff',shoes:'#e8fbff',hair:'#0f1a2c',fx:'ice',cel:'cool',col:'#5fd8ff',tag:'Ice crystals • Frost-shard dunks'},
 {name:'VOLT',skin:'#e6a97c',jersey:'#f2c200',trim:'#161616',shoes:'#161616',hair:'#f4f4f4',fx:'bolt',cel:'zap',col:'#fff25a',tag:'Lightning arcs • Thunder dunks'},
 {name:'SHADE',skin:'#6e4a38',jersey:'#7a35c9',trim:'#e6a0ff',shoes:'#1b1030',hair:'#0a0a0a',fx:'ghost',cel:'vanish',col:'#c06bff',tag:'Ghost clones • Void dunks'}
];
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=clamp(Math.round(((n>>16)&255)*f),0,255),g=clamp(Math.round(((n>>8)&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return `rgb(${r},${g},${b})`;}
CHARS.forEach(c=>{c.skinD=shade(c.skin,0.82);c.jerseyD=shade(c.jersey,0.8);});
const POWERS=[
 {id:'deadeye',key:1,name:'DEADEYE',desc:'Wider green zone + better odds',col:'#ffd23f',ch:'4 THREES',goal:4,ev:'three'},
 {id:'sky',key:2,name:'SKY WALKER',desc:'Higher jumps, longer block + dunk reach',col:'#35e0ff',ch:'5 BLOCKS',goal:5,ev:'block'},
 {id:'turbo',key:3,name:'TURBO',desc:'Faster + quicker skill moves',col:'#5dff7a',ch:'3 ANKLE BREAKS',goal:3,ev:'ankle'},
 {id:'lock',key:4,name:'LOCKDOWN',desc:'Easy steals + heavy contests',col:'#c06bff',ch:'3 STEALS',goal:3,ev:'steal'},
 {id:'fire',key:5,name:'ON FIRE',desc:'Every bucket is worth +1',col:'#ff6a2b',ch:'3 IN A ROW',goal:3,ev:'streak'}
];
const POWER_DUR=14;
const NET0=()=>({role:null,room:null,code:'',peerId:null,gin:null,gl:null,lin:{mx:0,sh:0,j:0,sd:0,su:0,a:0,pu:[0,0,0,0,0],rm:null},evs:[],evId:0,lastEv:-1,seq:0,lastSeq:-1,lastSnapAt:0,lastSend:0,lastInJ:'',lcs:0,frz:null,gch:0,joinAt:0,missT:0,found:false});
let NET=NET0(),netMute=0;
const ME=()=>NET.role==='guest'?1:0;
const lab=i=>i===ME()?'YOU':(NET.role?'FRIEND':'CPU');
function nev(a){if(NET.role!=='host'||netMute||!G)return;NET.evs.push([++NET.evId].concat(a));if(NET.evs.length>14)NET.evs.shift();}
const IDLE={mx:0,jump:false,shootPress:false,shootRel:false,shootHeld:false,act:false,actDir:0,instant:false};

// ====================== AUDIO ======================
let AC=null,muted=false;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,fq,delay){if(!AC||muted)return;try{const t=AC.currentTime+(delay||0);const n=Math.floor(AC.sampleRate*d);const b=AC.createBuffer(1,n,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||2000;const g=AC.createGain();g.gain.value=v||0.15;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);}catch(e){}}
const SFX={
 bounce(v){tone(110,0.09,'sine',0.17*(v===undefined?1:v),-50);},
 swish(){noise(0.35,0.22,3500);},
 rim(){tone(420,0.12,'square',0.06,-120);tone(640,0.1,'triangle',0.07,-200);},
 board(){tone(200,0.1,'square',0.07,-60);},
 perfect(){[660,880,1100].forEach((f,i)=>tone(f,0.16,'triangle',0.09,0,i*0.06));},
 super(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,'triangle',0.1,0,i*0.07));noise(0.5,0.1,6000,0.1);},
 dunk(){tone(90,0.4,'sawtooth',0.18,-60);noise(0.4,0.22,500);},
 block(){noise(0.14,0.28,1200);tone(180,0.12,'square',0.1,-100);},
 steal(){tone(500,0.1,'square',0.07,300);},
 skill(){tone(300,0.15,'sawtooth',0.06,500);},
 power(){[400,600,800,1200].forEach((f,i)=>tone(f,0.18,'square',0.06,0,i*0.07));},
 whistle(){tone(2200,0.25,'sine',0.07,100);},
 click(){tone(700,0.05,'square',0.05);},
 buzz(){tone(120,0.3,'sawtooth',0.1,-30);},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.1,0,i*0.12));},
 lose(){[400,350,300,220].forEach((f,i)=>tone(f,0.25,'sawtooth',0.08,0,i*0.16));}
};

const SFX_RAW=Object.assign({},SFX);
Object.keys(SFX_RAW).forEach(k=>{SFX[k]=a=>{SFX_RAW[k](a);nev(['s',k,typeof a==='number'?+a.toFixed(2):null]);};});
// ====================== INPUT ======================
const down={},just={},rel={};
const ARROWMAP={ArrowLeft:'KeyA',ArrowRight:'KeyD',ArrowUp:'KeyW',ArrowDown:'KeyS'};
let screen='menu',G=null;
addEventListener('keydown',e=>{
 audioInit();
 if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
 const c=ARROWMAP[e.code]||e.code;
 if(!e.repeat){if(!down[c])just[c]=true;}
 down[c]=true;
 if(e.repeat)return;
 if(e.code==='KeyM'){muted=!muted;}
 if(screen==='menu')menuKey(e.code);
 else if(screen==='online')onlineKey(e);
 else if(screen==='play'){if(!NET.role&&(e.code==='KeyP'||e.code==='Escape'))screen='pause';}
 else if(screen==='pause'){if(e.code==='KeyP'||e.code==='Escape'||e.code==='Enter')screen='play';else if(e.code==='KeyQ'){screen='menu';}}
 else if(screen==='over'){if(NET.role==='guest'){if(e.code==='Escape'){netLeave();screen='menu';}}else if(e.code==='Enter'||e.code==='Space')startMatch();else if(e.code==='Escape'){if(NET.role)netLeave();screen='menu';}}
});
addEventListener('keyup',e=>{const c=ARROWMAP[e.code]||e.code;down[c]=false;rel[c]=true;});
addEventListener('blur',()=>{for(const k in down){if(down[k])rel[k]=true;down[k]=false;}if(screen==='play'&&!NET.role)screen='pause';});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='play'&&!NET.role)screen='pause';});
function clearEdges(){for(const k in just)delete just[k];for(const k in rel)delete rel[k];}
function humanIntent(){
 const mx=(down.KeyD?1:0)-(down.KeyA?1:0);
 return {mx,jump:!!just.KeyW,shootPress:!!just.Space,shootRel:!!rel.Space,shootHeld:!!down.Space,act:!!just.KeyS,actDir:mx,instant:false};
}
// touch buttons
const isTouch=(()=>{try{return matchMedia('(pointer:coarse)').matches;}catch(e){return false;}})();
if(isTouch)document.body.classList.add('touch');
[['tL','KeyA'],['tR','KeyD'],['tJ','KeyW'],['tS','KeyS'],['tF','Space']].forEach(([id,code])=>{
 const el=document.getElementById(id);if(!el||!el.addEventListener)return;
 const on=e=>{e.preventDefault();audioInit();if(!down[code])just[code]=true;down[code]=true;el.classList.add('on');};
 const off=e=>{e.preventDefault();if(down[code])rel[code]=true;down[code]=false;el.classList.remove('on');};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
});
function cvPoint(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
let hits=[];
cv.addEventListener('pointerdown',e=>{
 audioInit();const p=cvPoint(e);
 for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();SFX.click();return;}}
});

// ====================== HELPERS ======================
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,align,weight,stroke){
 ctx.font=`${weight||800} ${size}px system-ui,"Segoe UI",Arial,sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
 if(stroke){ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
 ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ik(ax,ay,bx,by,l1,l2,bend){
 let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);const mx=l1+l2-0.5;
 if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}if(d<8)d=8;
 const a=Math.atan2(dy,dx),c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),t=a+bend*Math.acos(c);
 return {jx:ax+Math.cos(t)*l1,jy:ay+Math.sin(t)*l1,ex:ax+dx,ey:ay+dy};
}

// ====================== EFFECTS ======================
const FX=[],RINGS=[],BOLTS=[],POPS=[];
function part(o){FX.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:0.6,max:0.6,r:3,col:'#fff',add:true},o));if(FX.length>800)FX.shift();}
function burst(x,y,col,n,spd,life,r,g){nev(['b',Math.round(x),Math.round(y),col,n,Math.round(spd),+(life||0.7).toFixed(2),r===undefined?null:r,g===undefined?null:g]);for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(spd*0.3,spd);const l=(life||0.7)*rnd(0.7,1.2);part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:g===undefined?500:g,life:l,max:l,r:rnd((r||3)*0.6,(r||3)*1.4),col});}}
function ring(x,y,col,r1,life,lw){nev(['r',Math.round(x),Math.round(y),col,r1||140,life||0.5,lw||6]);RINGS.push({x,y,r:8,r1:r1||140,life:life||0.5,max:life||0.5,col,lw:lw||6});}
function bolt(x1,y1,x2,y2,col,life){const pts=[{x:x1,y:y1}];const n=7;for(let i=1;i<n;i++){const t=i/n;pts.push({x:lerp(x1,x2,t)+rnd(-18,18),y:lerp(y1,y2,t)+rnd(-18,18)});}pts.push({x:x2,y:y2});BOLTS.push({pts,life:life||0.25,max:life||0.25,col});}
function pop(text,x,y,col,size,life){nev(['p',String(text),Math.round(x),Math.round(y),col||'#fff',size||34,life||1.1]);POPS.push({text,x,y,vy:-40,life:life||1.1,max:life||1.1,col:col||'#fff',size:size||34});if(POPS.length>14)POPS.shift();}
function toast(text,col,i){nev(['t',text,col,i===undefined?-1:i]);if(G&&(i===undefined||i===ME())){G.toast={text,col,t:2.6};}}
function updateFX(dt){
 for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.life-=dt;if(p.life<=0){FX.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
 for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i];r.life-=dt;if(r.life<=0){RINGS.splice(i,1);continue;}r.r=lerp(8,r.r1,1-r.life/r.max);}
 for(let i=BOLTS.length-1;i>=0;i--){BOLTS[i].life-=dt;if(BOLTS[i].life<=0)BOLTS.splice(i,1);}
 for(let i=POPS.length-1;i>=0;i--){const p=POPS[i];p.life-=dt;if(p.life<=0){POPS.splice(i,1);continue;}p.y+=p.vy*dt;p.vy*=0.97;}
 if(G){G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*2.2);G.netSwing=G.netSwing.map(v=>Math.max(0,v-dt*1.3));G.rimShake=G.rimShake.map(v=>Math.max(0,v-dt*2));if(G.toast){G.toast.t-=dt;if(G.toast.t<=0)G.toast=null;}
  for(const p of G.p){for(let i=p.trail.length-1;i>=0;i--){p.trail[i].life-=dt;if(p.trail[i].life<=0)p.trail.splice(i,1);}}}
}
function charFxSkill(p,dt){
 const fx=p.ch.fx,x=p.x,y=FLOOR-p.h;
 if(fx==='fire'){for(let i=0;i<2;i++)part({x:x-p.dir*rnd(0,20),y:y-rnd(0,90),vx:rnd(-30,30),vy:-rnd(60,200),life:0.5,max:0.5,r:rnd(4,8),col:['#ff5a1f','#ffb21f','#ffe066'][Math.floor(rnd(0,3))]});}
 else if(fx==='ice'){part({x:x-p.dir*rnd(0,30),y:y-rnd(0,100),vx:rnd(-40,40),vy:rnd(20,100),g:200,life:0.7,max:0.7,r:rnd(2,5),col:Math.random()<0.5?'#ffffff':'#8fe8ff'});if(Math.random()<0.3)part({x:x,y:y-4,vx:rnd(-60,60),vy:-rnd(40,120),g:400,life:0.5,max:0.5,r:5,col:'#bff4ff'});}
 else if(fx==='bolt'){p.fxT=(p.fxT||0)-dt;if(p.fxT<=0){p.fxT=0.07;bolt(x+rnd(-20,20),y-rnd(20,150),x+rnd(-80,80),y-rnd(0,170),'#fff25a',0.16);}}
 else{p.trailT-=dt;if(p.trailT<=0){p.trailT=0.045;p.trail.push({x:p.x,h:p.h,dir:p.dir,pose:computePose(p),life:0.38});if(p.trail.length>9)p.trail.shift();}part({x:x+rnd(-20,20),y:y-rnd(0,150),vx:rnd(-20,20),vy:-rnd(10,50),life:0.7,max:0.7,r:rnd(2,5),col:'#c06bff'});}
}
function charFxHit(att,def){nev(['h',att.i,def.i]);netMute++;try{charFxHit_(att,def);}finally{netMute--;}}
function charFxHit_(att,def){
 const fx=att.ch.fx,x=def.x,y=FLOOR-def.h;def.stunFx=fx;
 if(fx==='fire'){burst(x,y-60,'#ff7a2b',30,320,0.8,5,-100);ring(x,y,'#ff9a3b',130,0.5);}
 else if(fx==='ice'){burst(x,y-70,'#bff4ff',34,300,0.9,4,200);ring(x,y-60,'#8fe8ff',140,0.55);}
 else if(fx==='bolt'){for(let i=0;i<5;i++)bolt(x,y-170,x+rnd(-90,90),y,'#fff25a',0.3);ring(x,y-60,'#fff25a',120,0.4);}
 else{burst(x,y-60,'#c06bff',26,240,0.9,5,-60);ring(x,y-60,'#c06bff',150,0.6);ring(x,y-60,'#6a2fb0',90,0.5);}
}
function charFxDunk(p){nev(['d',p.i]);netMute++;try{charFxDunk_(p);}finally{netMute--;}}
function charFxDunk_(p){
 const fx=p.ch.fx,x=p.hx,y=RIM_Y;
 if(fx==='fire'){burst(x,y,'#ff7a2b',60,520,1.0,6,-150);burst(x,y,'#ffe066',30,420,0.8,4,-100);ring(x,y,'#ff6a2b',260,0.7,10);}
 else if(fx==='ice'){burst(x,y,'#bff4ff',50,560,1.0,4,300);ring(x,y,'#5fd8ff',260,0.7,10);ring(x,y,'#ffffff',160,0.5,5);}
 else if(fx==='bolt'){for(let i=0;i<8;i++)bolt(x,y,x+rnd(-260,260),y+rnd(-200,220),'#fff25a',0.35);ring(x,y,'#fff25a',240,0.6,8);burst(x,y,'#fff7a0',30,480,0.7,3,0);}
 else{ring(x,y,'#c06bff',280,0.8,10);ring(x,y,'#6a2fb0',200,0.7,8);ring(x,y,'#e6a0ff',120,0.6,5);burst(x,y,'#9a4fe0',44,380,1.1,5,-40);}
}
function auraTick(p,dt){
 if(!p.active)return;const pw=POWERS.find(x=>x.id===p.active.id);p.auraT-=dt;if(p.auraT>0)return;p.auraT=0.03;
 const x=p.x,y=FLOOR-p.h;
 if(pw.id==='deadeye')part({x:x+rnd(-24,24),y:y-rnd(20,170),vx:0,vy:-rnd(30,90),life:0.6,max:0.6,r:rnd(2,4),col:'#ffd23f'});
 else if(pw.id==='sky')part({x:x+rnd(-18,18),y:y+rnd(0,6),vx:rnd(-20,20),vy:rnd(60,180),life:0.45,max:0.45,r:rnd(2,4),col:'#35e0ff'});
 else if(pw.id==='turbo'){if(Math.abs(p.vx)>60)part({x:x-sgn(p.vx)*rnd(10,40),y:y-rnd(10,150),vx:-p.vx*0.4,vy:0,life:0.3,max:0.3,r:rnd(2,4),col:'#5dff7a'});}
 else if(pw.id==='lock'){const a=p.stT*5+rnd(0,6.28);part({x:x+Math.cos(a)*55,y:y-85+Math.sin(a)*70,vx:0,vy:0,life:0.35,max:0.35,r:3,col:'#c06bff'});}
 else part({x:x+rnd(-22,22),y:y-rnd(20,160),vx:rnd(-20,20),vy:-rnd(80,200),life:0.5,max:0.5,r:rnd(3,7),col:['#ff5a1f','#ffb21f','#ffe066'][Math.floor(rnd(0,3))]});
}
function celTick(p,dt){
 if(p.celT<=0||p.h>0)return;const fx=p.ch.fx,x=p.x,y=FLOOR-p.h;
 if(Math.random()<dt*40){
  if(fx==='fire')part({x:x+rnd(-30,30),y:y-rnd(0,170),vy:-rnd(60,160),life:0.6,max:0.6,r:rnd(3,7),col:['#ff5a1f','#ffb21f','#ffe066'][Math.floor(rnd(0,3))]});
  else if(fx==='ice')part({x:x+rnd(-60,60),y:y-rnd(120,200),vy:rnd(30,80),vx:rnd(-20,20),life:1.0,max:1.0,r:rnd(2,4),col:'#ffffff'});
  else if(fx==='bolt'){if(Math.random()<0.3)bolt(x+rnd(-10,10),y-175,x+rnd(-70,70),y-rnd(0,120),'#fff25a',0.14);}

function computePose(p,tt){
 const t=tt===undefined?p.stT:tt,st=p.state,grounded=p.h<=0.5,run=grounded?clamp(Math.abs(p.vx)/300,0,1):0;
 const ph=p.runPh,s=Math.sin(ph),c=Math.cos(ph);
 let crouch=0,lean=0,rot=0,sx=1,bob=0,hov=0,alpha=1,bx=null,by=null,fF,fB,hF,hB;
 // legs
 if(!grounded){const up=p.vh>0;fF={x:16,y:up?-20:-12};fB={x:-10,y:up?-9:-5};}
 else if(run>0.08){fF={x:s*26*run+8*(1-run),y:-Math.max(0,c)*15*run};fB={x:-s*26*run-8*(1-run),y:-Math.max(0,-c)*15*run};bob=-Math.abs(c)*3*run;lean=0.14*run;}
 else if(!p.ball){fF={x:20,y:0};fB={x:-18,y:0};crouch=0.2;lean=0.06;}
 else{fF={x:12,y:0};fB={x:-12,y:0};crouch=0.05;}
 if(p.land>0)crouch+=0.35*(p.land/0.14);
 // arms
 if(!p.ball){
  if(!grounded){hF={x:14,y:-174};hB={x:2,y:-170};}
  else if(run>0.08){hF={x:-s*22*run+16,y:-92-Math.max(0,-s)*10*run};hB={x:s*22*run-4,y:-92-Math.max(0,s)*10*run};}
  else{hF={x:34,y:-98};hB={x:6,y:-94};}
 }else{hF={x:10,y:-74};hB={x:-8,y:-76};}
 // ball poses
 if(st==='dunk'&&p.dunk){
  const d=p.dunk,u=Math.min(1,d.t/0.36),e=1-Math.pow(1-u,2);
  if(d.t<0.36){bx=lerp(14,50,e);by=lerp(-184,-124,e);hF={x:bx-2,y:by+10};hB={x:bx-14,y:by+8};}
  else{hF={x:56,y:-112};hB={x:44,y:-106};}
  fF={x:18,y:-26};fB={x:-16,y:-34};lean=0.18;crouch=0;
 }else if(st==='skill'&&p.skill){
  const k=p.skill.k,u=p.skill.t/p.skill.dur;
  if(k===0){bx=36*Math.cos(u*Math.PI*3);by=-14-48*Math.abs(Math.sin(u*Math.PI*3));lean=0.32;crouch=0.4;fF={x:26,y:0};fB={x:-22,y:0};hF={x:bx,y:clamp(by-10,-100,-50)};hB={x:26,y:-96};}
  else if(k===1){lean=-0.3;crouch=0.25;bx=24-8*u;by=-104;hF={x:bx+6,y:by+8};hB={x:bx-6,y:by+10};if(grounded){fF={x:22,y:0};fB={x:-16,y:0};}}
  else{const cs=Math.cos(u*Math.PI*2);sx=Math.abs(cs)<0.12?(cs<0?-0.12:0.12):cs;crouch=0.3;lean=0.1;bx=22;by=-70;hF={x:bx+6,y:by-4};hB={x:bx-8,y:by};if(grounded){fF={x:16,y:0};fB={x:-16,y:0};}}
 }else if(p.ball){
  if(p.charging||p.pend){
   const g=p.pend?1:Math.min(1,p.chargeT*3);bx=lerp(20,16,g);by=lerp(-120,-172,g);if(p.pend){bx=22;by=-182;}
   hF={x:bx+9,y:by+14};hB={x:bx-9,y:by+16};if(grounded)crouch=p.pend?0:0.32*Math.min(1,p.chargeT*4);lean=-0.04;
  }else if(!grounded){bx=16;by=-166;hF={x:bx+8,y:by+14};hB={x:bx-8,y:by+14};}
  else{const a2=p.dribT*7.4;by=-12-58*Math.abs(Math.sin(a2));bx=34+run*8;hF={x:bx-4,y:clamp(by-10,-100,-62)};hB={x:20,y:-102};}
 }else if(p.followT>0){hF={x:34,y:-170+(0.5-p.followT)*70};hB={x:20,y:-164};}
 else if(p.stealT>0){const u=1-p.stealT/0.34,r=Math.sin(u*Math.PI);hF={x:20+48*r,y:-86};hB={x:4,y:-100};lean=0.2*r;crouch=0.25;fF={x:24,y:0};fB={x:-18,y:0};}
 // celebrate
 if(p.celT>0&&grounded&&!p.ball&&st==='idle'&&p.stunT<=0){
  const k=p.ch.cel;fF={x:14,y:0};fB={x:-14,y:0};lean=0;crouch=0;
  if(k==='flex'){hF={x:36,y:-134+Math.sin(t*9)*5};hB={x:-34,y:-134+Math.sin(t*9+1)*5};crouch=0.1+0.08*Math.sin(t*9);}
  else if(k==='cool'){hF={x:16,y:-100};hB={x:2,y:-102};lean=-0.08;}
  else if(k==='zap'){const j=Math.sin(t*40)>0.6?2:0;hF={x:18+j,y:-178};hB={x:-30,y:-96};lean=0.05+Math.sin(t*30)*0.03;}
  else{hov=4+Math.sin(t*3)*4;hF={x:12,y:-70};hB={x:-8,y:-72};alpha=0.45+0.55*Math.abs(Math.sin(t*3));fF={x:12,y:-hov};fB={x:-12,y:-hov};}
 }
 // stun
 if(p.stunT>0){
  const e=clamp((0.95-p.stunT)/0.22,0,1),back=p.stunT>0.25?1:p.stunT/0.25;
  rot=-0.75*e*back;crouch=0.7*back;lean=0;fF={x:8,y:0};fB={x:-4,y:0};
  hF={x:-30+Math.sin(t*30)*10,y:-132+Math.sin(t*22)*8};hB={x:-18+Math.cos(t*26)*8,y:-110};
 }
 const la=lean+crouch*0.3;
 const hip={x:-lean*10-crouch*6,y:-72+crouch*22+bob};
 const sh={x:hip.x+Math.sin(la)*TORSO,y:hip.y-Math.cos(la)*TORSO};
 const head={x:sh.x+Math.sin(la)*21+3,y:sh.y-Math.cos(la)*21-2};
 return {hip,sh,head,kF:ik(hip.x,hip.y,fF.x,fF.y,L_LEG,L_LEG,-1),kB:ik(hip.x,hip.y,fB.x,fB.y,L_LEG,L_LEG,-1),eF:ik(sh.x,sh.y,hF.x,hF.y,L_ARM,L_ARM,1),eB:ik(sh.x,sh.y,hB.x,hB.y,L_ARM,L_ARM,1),bx,by,rot,sx,alpha,hov};
}

 ctx.fillStyle=ch.shoes;ctx.beginPath();ctx.ellipse(po.kF.ex+5,po.kF.ey-3,11,6,0,0,Math.PI*2);ctx.fill();

 // front arm
 seg([sh,P(po.eF.jx,po.eF.jy),P(po.eF.ex,po.eF.ey)],9,ch.skin,glow);
 ctx.fillStyle=ch.skin;ctx.beginPath();ctx.arc(po.eF.ex,po.eF.ey,5,0,Math.PI*2);ctx.fill();

function setInbound(off,phase){

 o.x=off===0?420:860;d.x=o.x+o.s*85;o.dir=o.s;d.dir=sgn(o.x-d.x)||-o.s;

function mods(p){const a=p.active?p.active.id:null;return {spd:a==='turbo'?1.35:1,jump:a==='sky'?1.25:1,dunkR:a==='sky'?340:230,blockR:(a==='sky'?24:0)+(a==='lock'?16:0),skillCd:a==='turbo'?0.5:1,stealMul:a==='lock'?2.3:1,contest:a==='lock'?1.6:1,win:a==='deadeye'?1.55:1,pAdd:(a==='deadeye'?0.1:0)+(a==='fire'?0.06:0),fire:a==='fire'};}
function contestOf(p,o,mo){
 if(o.stunT>0||p.openT>0)return 0;
 const dx=(o.x-p.x)*p.dir;if(dx<-24||dx>150)return 0;
 let c=1-Math.max(0,dx)/150;if(o.h>18)c=Math.min(1,c*1.25+0.15);
 return Math.min(1,c*mo.contest);
}
function meterInfo(p,c,m){
 const d=Math.abs(p.hx-p.x);
 const sc=d<150?1.5:d<ARC_D?lerp(1.15,0.95,(d-150)/(ARC_D-150)):clamp(0.85-(d-ARC_D)*0.0006,0.55,0.85);
 const wG=Math.max(0.018,0.055*sc*(1-0.5*c)*m.win);
 return {target:TARGET,wG,sh:wG*0.4};
}
function progress(p,ev){

 for(const pw of POWERS){if(pw.ev===ev){p.prog[pw.id]++;if(p.prog[pw.id]>=pw.goal){p.prog[pw.id]=0;award(p,pw.id);}}}
}

function stepPlayer(p,it,dt){
 const o=G.p[1-p.i],m=mods(p),mo=mods(o);
 p.stT+=dt;
 for(const k of ['stunT','skillCd','stealCd','openT','popCd','land','followT','celT','stealT']){if(p[k]>0)p[k]-=dt;}
 if(p.active){p.active.t-=dt;if(p.active.t<=0){p.active=null;}}
 if(!it||G.phase!=='live')it=IDLE;
 if(p.state==='dunk'){updateDunk(p,o,dt,m,mo);auraTick(p,dt);return;}
 const stunned=p.stunT>0;
 if(stunned&&(p.charging||p.pend)){p.charging=false;p.pend=null;}
 if(p.state==='skill')updateSkill(p,dt,m);
 const canAct=!stunned&&p.state!=='skill'&&!(p.stealT>0);
 // facing
 if(canAct){
  if(p.charging||p.pend)p.dir=p.hx>=p.x?1:-1;
  else if(!p.ball&&o.ball)p.dir=sgn(o.x-p.x)||p.dir;
  else if(it.mx!==0)p.dir=sgn(it.mx);
 }
 // horizontal
 if(p.state!=='skill'){
  let tvx=0;
  if(canAct){const sp=SPD*m.spd*(p.ball?0.93:1)*((p.charging||p.pend)?0.22:1);tvx=it.mx*sp;}
  else if(p.stealT>0)tvx=p.vx*0.5;
  p.vx+=(tvx-p.vx)*Math.min(1,(p.h>0?7:16)*dt);
 }
 // jump
 if(canAct&&it.jump&&p.h<=0&&!p.charging&&!p.pend){p.vh=JV*m.jump;}
 // vertical
 if(p.h>0||p.vh>0){
  const g=PG*((p.charging&&p.h>0)?0.35:1);p.vh-=g*dt;p.h+=p.vh*dt;
  if(p.h<=0){if(p.vh<-250)p.land=0.14;p.h=0;p.vh=0;}
 }
 p.x=clamp(p.x+p.vx*dt,112,1168);
 if(p.h<=0)p.runPh+=Math.abs(p.vx)*dt*0.05;
 // dribble
 if(p.ball&&p.h<=0&&!p.charging&&!p.pend&&p.state==='idle'){
  const prev=Math.floor(p.dribT*7.4/Math.PI);p.dribT+=dt*(1+Math.abs(p.vx)/600);
  if(Math.floor(p.dribT*7.4/Math.PI)!==prev&&p.human&&G.phase==='live')SFX.bounce(0.35);
 }
 // shooting
 if(p.ball){
  if(canAct&&it.shootPress&&!p.charging&&!p.pend)tryStartShot(p,o,m,mo);
  if(p.charging){
   p.chargeT+=dt;p.meter+=dt/FILL;
   if(it.shootRel||!it.shootHeld||p.meter>=1){if(it.relMeter!==undefined)p.meter=it.relMeter;releaseShot(p,o,m,mo);}
  }
 }
 if(p.pend){p.pend.t-=dt;if(p.pend.t<=0)execShot(p,o,m,mo);}
 // act (skill / steal)
 if(canAct&&it.act){
  if(p.ball&&p.skillCd<=0&&p.h<=0&&!p.charging&&!p.pend&&p.state==='idle'){
   if(it.instant)startSkill(p,o,m,it.actDir);else{p.skillBuf=0.07;p.skillDirBuf=it.mx;}
  }
 }
 if(canAct&&it.shootPress&&!p.ball&&o.ball&&p.stealCd<=0&&p.h<=0)doSteal(p,o,m);
 if(p.skillBuf>0){
  if(it.mx!==0)p.skillDirBuf=sgn(it.mx);p.skillBuf-=dt;
  if(p.skillBuf<=0){p.skillBuf=0;if(canAct&&p.ball&&p.skillCd<=0&&p.h<=0&&!p.charging&&!p.pend&&p.state==='idle')startSkill(p,o,m,p.skillDirBuf);}
 }
 auraTick(p,dt);celTick(p,dt);
}
function tryStartShot(p,o,m,mo){
 if(p.h>18&&Math.abs(p.hx-p.x)<m.dunkR&&(p.hx-p.x)*p.s>-20){startDunk(p,o,m,mo);return;}
 p.charging=true;p.meter=0;p.chargeT=0;p.dir=p.hx>=p.x?1:-1;
}
function releaseShot(p,o,m,mo){
 const c=contestOf(p,o,mo),mi=meterInfo(p,c,m),e=p.meter-mi.target,ae=Math.abs(e);
 let q;
 if(p.meter<0.12)q='wayearly';else if(ae<=mi.sh)q='super';else if(ae<=mi.wG)q='perfect';else if(ae<=mi.wG*2.6)q=e<0?'early':'late';else q=e<0?'wayearly':'waylate';
 p.charging=false;p.pend={t:p.h>16?0:0.09,q,e,c};p.st.att++;
 if(p.h<=0)p.vh=430;
 p.followT=0.5;
 const lab={super:['SUPER PERFECT!!','#ffd23f',40],perfect:['PERFECT!','#37e06a',32],early:['EARLY','#ffa94d',24],late:['LATE','#ffa94d',24],wayearly:['WAY TOO EARLY','#ff6a6a',24],waylate:['WAY TOO LATE','#ff6a6a',24]}[q];
 pop(lab[0],p.x,FLOOR-p.h-215,lab[1],lab[2],q==='super'?1.5:0.9);
 if(q==='super'){SFX.super();G.flash=0.35;burst(p.x,FLOOR-p.h-175,'#ffd23f',30,300,0.8,4,0);}
 else if(q==='perfect'){SFX.perfect();}
}
function execShot(p,o,m,mo){
 const pe=p.pend;p.pend=null;const b=G.ball,s=p.s;
 const d=Math.abs(p.hx-p.x),three=d>=ARC_D;
 const reach=o.h+174+mo.blockR,relY=p.h+172,dx=(o.x-p.x)*p.dir;
 if(o.stunT<=0&&o.state==='idle'&&o.h>20&&dx>-35&&dx<92+mo.blockR&&reach>=relY-2){
  b.state='free';b.owner=-1;p.ball=false;b.shooter=p.i;b.shotActive=false;b.touched=true;b.noPick=0.25;b.noRim=false;
  b.x=p.x+p.dir*20;b.y=FLOOR-p.h-172;b.vx=-p.dir*rnd(250,420)+o.vx*0.3;b.vy=-rnd(120,260);
  o.st.blocks++;progress(o,'block');pop('BLOCKED!',p.x+p.dir*40,FLOOR-p.h-215,'#ff6a6a',38,1.2);SFX.block();G.shake=10;burst(b.x,b.y,'#ffffff',16,300,0.4,3,300);
  return;
 }
 const base=clamp(0.92-d*0.0011,0.3,0.92)+m.pAdd;
 let pr;
 if(pe.q==='super')pr=1;
 else if(pe.q==='perfect')pr=clamp(base+0.28,0,0.97)*(1-0.2*pe.c);
 else if(pe.q==='early'||pe.q==='late')pr=base*0.5*(1-0.4*pe.c);
 else pr=base*0.16*(1-0.4*pe.c);
 const made=Math.random()<pr;
 b.state='free';b.owner=-1;p.ball=false;b.shooter=p.i;b.shotActive=true;b.scored=false;b.touched=false;b.rimHits=0;b.noPick=0.45;b.noRim=pe.q==='super';
 b.pts=(three?3:2)+(m.fire?1:0);b.kind=three?'three':'two';b.hoop=p.i;b.hx=p.hx;
 b.x=p.x+p.dir*16;b.y=FLOOR-p.h-172;
 let tx,ty=RIM_Y+4;
 if(made){tx=p.hx+(b.noRim?0:rnd(-5,5));}
 else{
  const early=pe.e<0;
  if(pe.q==='wayearly')tx=p.hx-s*(RIM_HALF+rnd(30,110));
  else if(pe.q==='waylate')tx=p.hx+s*(RIM_HALF+rnd(30,70));
  else if(pe.q==='perfect')tx=p.hx+(early?-1:1)*s*(RIM_HALF-rnd(2,8));
  else if(early)tx=p.hx-s*(RIM_HALF+rnd(-2,16));
  else tx=p.hx+s*(RIM_HALF+rnd(2,24));
 }
 launchTo(b,tx,ty,d);
}
function launchTo(b,tx,ty,d){
 const arcH=clamp(70+d*0.16,70,190),ya=Math.min(b.y,ty)-arcH;
 const t1=Math.sqrt(2*(b.y-ya)/BALL_G),t2=Math.sqrt(2*(ty-ya)/BALL_G),T=t1+t2;
 b.vx=(tx-b.x)/T;b.vy=-BALL_G*t1;
}
function startSkill(p,o,m,dir){
 const k=dir<0?0:dir>0?2:1,dur=[0.5,0.46,0.5][k];
 p.state='skill';p.skill={k,t:0,dur,vx:0};p.skillCd=1.25*m.skillCd;p.charging=false;p.skillBuf=0;
 p.dir=k===0?-p.s:p.s;if(k===1)p.vh=330;
 SFX.skill();
 const dxo=Math.abs(o.x-p.x);
 if(dxo<135&&o.h<30&&o.stunT<=0&&o.state==='idle'&&o.stealT<=0){
  const chance=o.human?0.8:[0.95,0.8,0.6][G.diff];
  if(Math.random()<chance){
   o.stunT=0.95;o.vx=0;o.charging=false;o.pend=null;p.st.ankles++;progress(p,'ankle');
   pop('ANKLE BREAKER!',p.x,FLOOR-p.h-215,p.ch.col,36,1.3);charFxHit(p,o);G.shake=8;SFX.block();
  }
 }
}
function updateSkill(p,dt,m){
 const s=p.skill;s.t+=dt;const u=s.t/s.dur;
 const sp=[-470,-330,520][s.k]*(m.spd>1?1.2:1)*p.s;
 s.vx=sp*(1-u*0.6);p.vx=s.vx;
 charFxSkill(p,dt);
 if(s.t>=s.dur){p.state='idle';p.vx*=0.3;if(s.k===1)p.openT=1.4;else p.openT=0.45;p.skill=null;}
}
function doSteal(p,o,m){

 const dx=(o.x-p.x)*p.dir;
 if(dx>-14&&dx<86&&o.h<30&&o.state==='idle'){
  let ch=(p.human?0.32:[0.1,0.17,0.25][G.diff])*m.stealMul*((o.charging||o.pend)?1.5:1);
  if(Math.random()<ch){
   o.stunT=Math.max(o.stunT,0.2);o.stunFx=null;giveBall(p,true,14);p.st.steals++;progress(p,'steal');
   pop('STOLEN!',p.x,FLOOR-p.h-215,'#b9a0ff',38,1.2);SFX.steal();G.shake=6;

function startDunk(p,o,m,mo){

function updateDunk(p,o,dt){
 const d=p.dunk;d.t+=dt;const T1=0.36;
 if(d.t<T1){
  const u=d.t/T1,e=1-Math.pow(1-u,2);
  p.x=lerp(d.x0,p.hx-p.s*52,e);p.h=lerp(d.h0,150,Math.min(1,u*1.35));p.vh=0;p.vx=0;
  if(d.rej&&d.t>0.17){rejectDunk(p,o);return;}
 }else{
  p.x=p.hx-p.s*52;p.h=150;p.vh=0;
  if(!d.slammed){d.slammed=true;slam(p);}
  if(d.t>T1+0.22){p.state='idle';p.vh=0;p.vx=0;p.dunk=null;}
 }
}

function updateBall(dt){
 const b=G.ball;
 if(b.state==='held'){
  const p=G.p[b.owner],ps=computePose(p);
  b.px=b.x;b.py=b.y;b.x=p.x+p.dir*(ps.bx===null?20:ps.bx);b.y=FLOOR-p.h+(ps.by===null?-90:ps.by);b.vx=b.vy=0;return;

 b.vy+=BALL_G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt*0.04;
 const bh=HX[b.hoop];
 if(b.scored&&Math.abs(b.x-bh)<RIM_HALF+6&&b.y>RIM_Y&&b.y<RIM_Y+70){b.vx+=(bh-b.x)*10*dt;b.vx*=1-4*dt;b.vy=Math.max(b.vy*(1-2.5*dt),180);}
 if(!b.noRim){

   }

 }

  if(b.x+BALL_R>1196&&b.x<1210){b.x=1196-BALL_R;if(b.vx>0){b.vx=-b.vx*0.55;SFX.board();b.touched=true;b.rimHits++;}}
  if(b.x-BALL_R<84&&b.x>70){b.x=84+BALL_R;if(b.vx<0){b.vx=-b.vx*0.55;SFX.board();b.touched=true;b.rimHits++;}}
 }
 if(b.x<22+BALL_R){b.x=22+BALL_R;b.vx=Math.abs(b.vx)*0.6;}

 }

}
function pickups(){

function separate(){
 const a=G.p[0],b=G.p[1];
 if(a.state==='dunk'||b.state==='dunk'||a.state==='skill'||b.state==='skill')return;
 if(a.h>45||b.h>45)return;
 const d=b.x-a.x,md=34;
 if(Math.abs(d)<md){const push=(md-Math.abs(d))/2*(d>=0?1:-1);a.x=clamp(a.x-push,112,1168);b.x=clamp(b.x+push,112,1168);}
}

// ====================== AI ======================
function aiPickRelease(p,o){
 const m=mods(p),mo=mods(o),c=contestOf(p,o,mo),mi=meterInfo(p,c,m),r=Math.random();
 const pr=[[0,0.2,0.45,0.35],[0.02,0.45,0.4,0.13],[0.06,0.62,0.28,0.04]][G.diff];
 const s=Math.random()<0.5?-1:1;let e;
 if(r<pr[0])e=rnd(-mi.sh*0.7,mi.sh*0.7);
 else if(r<pr[0]+pr[1])e=s*rnd(mi.sh*1.15,mi.wG*0.92);
 else if(r<pr[0]+pr[1]+pr[2])e=s*rnd(mi.wG*1.1,mi.wG*2.4);
 else e=s*rnd(mi.wG*2.8,mi.wG*5);
 return clamp(mi.target+e,0.1,0.985);
}
function aiIntent(p,o,dt){
 const a=p.ai,it={mx:0,jump:false,shootPress:false,shootRel:false,shootHeld:false,act:false,actDir:0,instant:true};
 const df=G.diff,spd=[0.8,0.93,1.0][df],m=mods(p);
 a.t=(a.t||0)+dt;
 if(G.mode==='super'&&!p.active){
  a.puT=(a.puT||0)+dt;
  if(a.puT>1.5){a.puT=0;const slots=p.inv.map((id,i)=>id?i:-1).filter(i=>i>=0);
   if(slots.length){let pick=slots[Math.floor(Math.random()*slots.length)];
    const want=p.ball?['deadeye','fire']:['lock','sky'];const pr=slots.find(i=>want.includes(p.inv[i]));if(pr!==undefined)pick=pr;activate(p,pick);}}
 }
 if(p.stunT>0||p.state==='skill'||p.state==='dunk')return it;
 const b=G.ball;
 if(p.ball){
  if(p.charging){it.shootHeld=true;if(p.meter>=a.relAt){it.shootRel=true;it.shootHeld=false;}return it;}
  if(!a.plan){a.plan=Math.random()<[0.25,0.35,0.42][df]?'drive':'spot';a.spotX=p.hx-p.s*(Math.random()<0.5?ARC_D+8:rnd(90,200));a.wait=rnd(0.3,0.8)*(1.3-df*0.25);a.skilled=false;}
  if(a.wait>0){a.wait-=dt;return it;}
  const dd=Math.abs(o.x-p.x),dR=p.hx-p.x,near=Math.abs(dR);
  const startShot=()=>{if(o.h>25&&Math.abs(o.x-p.x)<110&&G.sc>3.5)return;it.shootPress=true;it.shootHeld=true;a.relAt=aiPickRelease(p,o);};
  if(!a.skilled&&dd<120&&p.skillCd<=0&&p.h<=0&&Math.random()<dt*2.2*[0.4,0.8,1.2][df]){it.act=true;it.actDir=[-1,0,1][Math.floor(rnd(0,3))];a.skilled=true;return it;}
  if(G.sc<3.2&&p.h<=0){startShot();return it;}
  if(a.plan==='drive'){
   it.mx=sgn(dR)*spd;
   if(p.h<=0&&near<m.dunkR*0.8&&near>60)it.jump=true;
   if(p.h>26&&near<m.dunkR){it.shootPress=true;it.shootHeld=true;}
   else if(p.h<=0&&near<=70)startShot();
  }else{
   const dx=a.spotX-p.x;
   if(Math.abs(dx)>14)it.mx=sgn(dx)*spd;else startShot();
  }
  return it;
 }
 if(o.ball){
  const lag=[3.5,6,10][df];
  let goal=o.x+o.s*62;goal=o.s>0?Math.min(goal,o.hx-30):Math.max(goal,o.hx+30);
  a.tx=a.tx===undefined?p.x:lerp(a.tx,goal,1-Math.exp(-lag*dt));
  const dx=a.tx-p.x;if(Math.abs(dx)>10)it.mx=sgn(dx)*spd;
  if(o.charging&&p.h<=0&&Math.abs(o.x-p.x)<150&&!a.blockPlanned){a.blockPlanned=true;if(Math.random()<[0.3,0.55,0.8][df])a.jumpAt=a.t+rnd(0.25,0.75);}
  if(a.jumpAt&&a.t>=a.jumpAt){it.jump=true;a.jumpAt=0;}
  if(!o.charging)a.blockPlanned=false;
  if(o.h>12&&!o.charging&&Math.abs(o.x-o.hx)<260&&p.h<=0&&Math.random()<dt*[1,2,3][df])it.jump=true;
  if(Math.abs(o.x-p.x)<64&&p.stealCd<=0&&G.possT>0.9&&Math.random()<dt*[0.25,0.45,0.7][df])it.shootPress=true;
  return it;
 }
 const dx=b.x-p.x;if(Math.abs(dx)>14)it.mx=sgn(dx)*spd;
 if(b.y<FLOOR-190&&Math.abs(dx)<80&&p.h<=0)it.jump=true;
 return it;
}
// ====================== UPDATE ======================
function update(dt){
 if(screen==='menu'){M.t+=dt;updateFX(dt);clearEdges();return;}
 if(screen==='online'){M.t+=dt;onlineTick(dt);updateFX(dt);clearEdges();return;}
 if(NET.role==='guest'){guestUpdate(dt);return;}
 if(NET.role==='host'&&G&&NET.room){
  const pr=NET.room.peers().find(p=>p.peer===NET.peerId);
  if(pr){NET.missT=0;if(pr.presence&&pr.presence.in&&typeof pr.presence.in==='object')NET.gin=pr.presence.in;}
  else{NET.missT+=dt;if(NET.missT>3){netEnd('Your friend left the game.');return;}}
 }
 if(screen!=='play'){if(G)G.overT+=dt;updateFX(dt);clearEdges();return;}
 G.time+=dt;G.phaseT+=dt;G.possT+=dt;G.helpT=Math.max(0,G.helpT-dt);
 if(G.mode==='super'&&G.phase==='live'){for(let i=0;i<5;i++){if(just['Digit'+(i+1)]||just['Numpad'+(i+1)])tryActivate(G.p[0],i);}}
 if(G.phase==='tip'&&G.phaseT>2.7){G.phase='live';SFX.whistle();}
 else if(G.phase==='inbound'&&G.phaseT>1.0){G.phase='live';}
 else if(G.phase==='scored'){if(G.winner>=0){if(G.phaseT>2.2)endMatch();}else if(G.phaseT>1.8)setInbound(1-G.lastScorer,'inbound');}
 if(screen!=='play'){clearEdges();return;}
 for(const p of G.p){const o=G.p[1-p.i];let it;if(p.i===1&&NET.role==='host'){const ni=netIntent(p);it=G.phase==='live'?ni:null;}else it=G.phase==='live'?(p.human?humanIntent():aiIntent(p,o,dt)):null;stepPlayer(p,it,dt);}
 separate();
 updateBall(dt);
 pickups();
 const b=G.ball;
 if(G.phase==='live'){
  if(b.state==='held'){G.sc-=dt;if(G.sc<=0){pop('SHOT CLOCK!',640,260,'#ff6a6a',44,1.2);SFX.buzz();const off=b.owner;setInbound(1-off,'inbound');}}
  else{G.freeT+=dt;if(G.freeT>6){const n=Math.abs(b.x-G.p[0].x)<Math.abs(b.x-G.p[1].x)?G.p[0]:G.p[1];giveBall(n,false,14);}}
  if(b.state==='held')G.freeT=0;
 }
 updateFX(dt);clearEdges();
}

   btn('JOIN A GAME',680,170,420,150,'#5fd8ff',()=>{O.stage='joining';O.typed='';},false);
   txt('Type the code your friend gives you',890,345,17,'#cfd6ff','center',700);
  }
  panel(180,390,920,200);
  txt('HOW IT WORKS',W/2,420,16,'#ffd23f','center',900);
  [NET_KIND==='peer'?'1.  Send your friend the link to this game. No accounts or logins needed.':'1.  Share this game with your friend (Share button on the game’s Claude page). They need a Claude account.',
   '2.  One of you clicks CREATE A GAME and tells the other the 4-digit code.',
   '3.  The other clicks JOIN A GAME and types the code. The match starts as soon as they join.',
   '4.  Keep the game tab open and on screen while you play.'].forEach((l,i)=>txt(l,200,458+i*32,16,'#dfe5ff','left',700));
  back();
 }else if(O.stage==='hosting'){
  txt('YOUR GAME CODE',W/2,190,22,'#9aa6d8','center',900);
  txt(NET.code,W/2,290,150,'#ffd23f','center',900,'#120a05');
  txt('Tell your friend this code. They click PLAY A FRIEND ONLINE → JOIN A GAME and type it.',W/2,410,19,'#dfe5ff','center',700);
  txt('Waiting for your friend to join'+'.'.repeat(1+Math.floor(M.t*2)%3),W/2,470,22,'#5fd8ff','center',800);
  back('CANCEL (Esc)');
 }else if(O.stage==='joining'){
  txt('TYPE YOUR FRIEND’S CODE',W/2,170,24,'#9aa6d8','center',900);
  for(let i=0;i<4;i++){const x=W/2-170+i*90;ctx.save();rrect(x,200,70,90,12);ctx.fillStyle='rgba(10,12,30,0.92)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=i===O.typed.length?'#ffd23f':'rgba(255,255,255,0.35)';ctx.stroke();ctx.restore();txt(O.typed[i]||'',x+35,247,56,'#fff','center',900);}
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','JOIN'];
  keys.forEach((k,i)=>{const x=W/2-165+(i%3)*115,y=318+Math.floor(i/3)*70,join=k==='JOIN',ok=O.typed.length===4;
   btn(k,x,y,100,58,join?(ok?'#37e06a':'#4a5a4a'):'#9aa6d8',()=>{if(join){if(ok)joinGame(O.typed);}else if(k==='⌫')O.typed=O.typed.slice(0,-1);else if(O.typed.length<4)O.typed+=k;},join&&ok);});
  back();
 }else if(O.stage==='connecting'){
  const msg=NET.role==='guest'?(NET.found?'Found the game — starting…':'Looking for game '+NET.code+'…'):'Setting up your game…';
  txt(msg,W/2,330,32,'#5fd8ff','center',900);
  back('CANCEL (Esc)');
 }else if(O.stage==='msg'){
  panel(240,220,800,220);
  const words=String(O.msg).split(' ');let line='',lines=[];ctx.font='700 20px system-ui,Arial';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>720){lines.push(line);line=w;}else line=t;}lines.push(line);
  lines.forEach((l,i)=>txt(l,W/2,280+i*30,20,'#fff','center',700));
  btn('OK',W/2-100,370,200,52,'#37e06a',()=>{O.stage='choose';},true);
 }
}

// ====================== MAIN LOOP ======================
function render(){
 ctx.setTransform(RES,0,0,RES,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.shadowBlur=0;
 if(screen==='menu'){drawMenu();return;}
 if(screen==='online'){drawOnline();return;}
 drawWorld();
 if(screen==='play'){drawHUD();}
 else{
  hits=[];drawScoreboard();
  if(screen==='pause')drawPause();else if(screen==='over')drawOver();
 }
}
let last=0,acc=0;
function frame(ts){
 requestAnimationFrame(frame);
 const dt=Math.min(0.1,(ts-last)/1000||0);last=ts;acc+=dt;
 let n=0;while(acc>=STEP&&n<10){update(STEP);acc-=STEP;n++;}if(n>=10)acc=0;
 netFrame(ts);
 render();
}
window.__t={get NET(){return NET;},get O(){return O;},hostGame,joinGame,openOnline,get G(){return G;},get screen(){return screen;},set screen(v){screen=v;},M,update,startMatch,render,aiIntent,POWERS,activate,tryActivate,just,down,rel,get FX(){return FX;}};
requestAnimationFrame(frame);
})();
</script>
